name: Draft bounded checkpoint v2 generated JS codec
on:
  pull_request:
    paths:
      - 'src/durable-bounded-codec-v2.mjs'
      - 'tests/durable-bounded-codec-v2.test.mjs'
      - '.github/workflows/durable-bounded-codec-v2.yml'
permissions:
  contents: read
jobs:
  generated:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact candidate and execute generated codecs
        env:
          EXPECTED: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED"
          test -z "$(git status --porcelain)"
          git rev-parse HEAD^{tree}
          node --version
          node --test tests/durable-bounded-codec-v2.test.mjs

name: JS scalar package linkage v2
on:
  pull_request:
    paths:
      - 'src/scalar-package-interface.mjs'
      - 'src/build-package.mjs'
      - 'src/package-admission.mjs'
      - 'src/load-trusted-package.node.mjs'
      - 'tests/scalar-package-linkage-v2.test.mjs'
      - 'tests/scalar-package-loader-fixtures.test.mjs'
      - '.github/workflows/scalar-package-linkage-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compiled-esm:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact head and actual compiler/package tests
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          git rev-parse HEAD HEAD^{tree}
          node --version
          node --test tests/scalar-package-loader-fixtures.test.mjs tests/scalar-package-linkage-v2.test.mjs tests/package-admission-security.test.mjs tests/compiler.test.mjs

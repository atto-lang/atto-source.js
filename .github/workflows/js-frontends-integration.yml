name: Atto JS combined parser integration
on:
  push:
    branches:
      - integration/js-actor-result-mutex-operators-20261120
  pull_request:
    paths:
      - 'src/transpile-worker.mjs'
      - 'src/actor-state-counter.mjs'
      - 'src/result-int-parse-compiler.mjs'
      - 'tests/shared-frontend-integration.test.mjs'
      - 'tests/actor-attached-state-parity.test.mjs'
      - 'tests/result-int-parse-compiler.test.mjs'
      - 'tests/mutex-class-constructor-admission.test.mjs'
      - 'tests/scalar-xor-contract.test.mjs'
      - '.github/workflows/js-frontends-integration.yml'
      - '.github/private-ci-approved-repositories.txt'
permissions:
  contents: read
jobs:
  combined-trusted-js:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Exact HEAD and regular input mode
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[a-f0-9]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git diff --exit-code HEAD --
          test -z "$(git ls-files --others --exclude-standard)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          for path in src/transpile-worker.mjs src/actor-state-counter.mjs src/result-int-parse-compiler.mjs tests/shared-frontend-integration.test.mjs .github/workflows/js-frontends-integration.yml .github/private-ci-approved-repositories.txt; do
            mode="$(git ls-files -s -- "$path" | cut -d' ' -f1)"
            test "$mode" = "100644" || { echo "Unexpected symlink or mode for $path"; exit 1; }
          done
          test -f .github/private-ci-approved-repositories.txt
          # The integration branch is intentionally carrier-export DENIED.
          # A separate independently reviewed policy change is required to
          # alter this SHA; workflow changes alone do not authorize export.
          test "$(git hash-object .github/private-ci-approved-repositories.txt)" = "e861197f825e7f4c3587dd377d099f3eb3c862fe"
          git rev-parse 'HEAD^{tree}'
          git ls-files -s src/transpile-worker.mjs src/actor-state-counter.mjs src/result-int-parse-compiler.mjs
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax and combined guest execution
        run: |
          node --check src/transpile-worker.mjs
          node --check src/actor-state-counter.mjs
          node --check src/result-int-parse-compiler.mjs
          node --check tests/shared-frontend-integration.test.mjs
          node --test tests/shared-frontend-integration.test.mjs tests/scalar-xor-contract.test.mjs tests/typed-actor-receives.test.mjs tests/actor-attached-state-parity.test.mjs tests/result-int-parse-compiler.test.mjs tests/result-canonical-guest.test.mjs tests/mutex-class-constructor-admission.test.mjs tests/transpile-worker.test.mjs tests/actor-worker.test.mjs
      - name: Full repository Node regression suite
        run: npm test

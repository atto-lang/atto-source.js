name: Actor elastic policy v1 JS Worker fail-closed
on:
  pull_request:
    paths:
      - 'src/*actor*.mjs'
      - 'src/worker-actor-client.mjs'
      - 'src/pooled-actor-host.mjs'
      - 'tests/*actor*.test.mjs'
      - 'tests/pooled-actors.test.mjs'
      - '.github/workflows/actor-elastic-failclosed-v1.yml'
  push:
    paths:
      - 'src/*actor*.mjs'
      - 'src/worker-actor-client.mjs'
      - 'src/pooled-actor-host.mjs'
      - 'tests/*actor*.test.mjs'
      - 'tests/pooled-actors.test.mjs'
      - '.github/workflows/actor-elastic-failclosed-v1.yml'
permissions:
  contents: read
jobs:
  host-policy-only:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22.16.0'
      - name: Execute backend host fail-closed policy tests
        run: node --test tests/actor-worker.test.mjs
      - name: Evidence boundary
        run: echo 'SOURCE_FRONTEND_OR_HOST_ONLY; NOT backend guest elastic scheduling parity'

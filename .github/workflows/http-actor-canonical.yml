name: Canonical HTTP actor admission
on:
  push:
    branches: ['test/http-actor-canonical-admission-20261127']
  pull_request:
    paths:
      - 'tests/fixtures/http-actor-v1/**'
      - 'tests/http-actor*.test.mjs'
      - 'src/http-actor-admission.mjs'
      - '.github/workflows/http-actor-canonical.yml'
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  admission:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node --test tests/http-actor-fixture-pins.test.mjs tests/http-actor-admission.test.mjs

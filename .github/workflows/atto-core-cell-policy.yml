# Source-owned compiled pure policy guest, NOT a native mutable-loan or borrow-MIR proof.
name: Atto JS core Cell compiled policy guest (NOT borrow-MIR)
on:
  pull_request:
    paths:
      - 'library/atto.core/cell.atto'
      - 'tests/**core*cell*'
      - 'src/freestanding-core.mjs'
      - 'src/program-v2.mjs'
      - 'src/program-ir-v2.mjs'
      - '.github/workflows/atto-core-cell-policy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  js-core-cell-compiled-policy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout immutable source PR head, without retained token
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit, tree, blob, and clean checkout
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test -z "$(git status --porcelain --untracked-files=no)"
          echo "CORE_CELL_SOURCE_HEAD=$EXPECTED_HEAD"
          echo "CORE_CELL_SOURCE_TREE=$(git rev-parse 'HEAD^{tree}')"
          echo "CORE_CELL_SOURCE_BLOB=$(git rev-parse HEAD:library/atto.core/cell.atto)"
      - name: Set up immutable Node 22 test runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Run production typed-IR compiler and actual ESM policy guest vectors
        shell: bash
        run: |
          set -euo pipefail
          node --test tests/core-math-hash-cell-source.test.mjs
      - name: Report successful compiled Atto policy guest, not owned Cell runtime
        shell: bash
        run: |
          echo 'CORE_CELL_JS_POLICY_TYPED_IR_GUEST=EXECUTED; OWNED_CELL_BORROW_MIR=NOT_EXECUTED' >> "$GITHUB_STEP_SUMMARY"
          echo 'No private Git tree was exported; source SHA/tree/blob checked.' >> "$GITHUB_STEP_SUMMARY"
      - name: Do not promote failed or zero-step jobs
        if: failure()
        shell: bash
        run: |
          echo 'CORE_CELL_JS_POLICY_TYPED_IR_GUEST=NOT_VERIFIED; OWNED_CELL_BORROW_MIR=NOT_EXECUTED' >> "$GITHUB_STEP_SUMMARY"

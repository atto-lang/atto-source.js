name: Incremental compiler session candidate
on:
  pull_request:
    paths:
      - 'src/compiler.mjs'
      - 'tests/incremental-session.test.mjs'
      - 'tests/compiler-cache-envelope.test.mjs'
      - 'src/compiler-cache-envelope.node.mjs'
      - '.github/workflows/incremental-session-candidate.yml'
  workflow_dispatch:
permissions: {contents: read}
jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Execute real compiler candidate
        run: |
          set -eu
          node --test tests/compiler.test.mjs tests/incremental-session.test.mjs tests/compiler-cache-envelope.test.mjs
